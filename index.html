<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYMBIOS — Next-Gen Automation Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#050507',
                        card: '#0c0c10',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .glow-effect {
            box-shadow: 0 0 50px -10px rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-[#050507] text-white min-h-screen flex flex-col antialiased selection:bg-white selection:text-black">

    <!-- NAVBAR -->
    <header class="sticky top-0 z-50 bg-[#050507]/90 backdrop-blur-xl border-b border-white/[0.06]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="#" onclick="router.navigate('home')" class="flex items-center space-x-3 cursor-pointer group">
                <div class="w-8 h-8 rounded-lg bg-white/[0.08] border border-white/10 flex items-center justify-center group-hover:border-white/30 transition-colors">
                    <i data-lucide="cpu" class="w-4 h-4 text-white"></i>
                </div>
                <span class="font-bold tracking-widest text-lg text-white">SYMBIOS</span>
            </a>

            <!-- Desktop Navigation -->
            <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-neutral-400">
                <button onclick="router.navigate('home')" class="hover:text-white transition-colors">Home</button>
                <button onclick="router.navigate('games')" class="hover:text-white transition-colors">Games</button>
                <button onclick="router.navigate('donate')" class="hover:text-white transition-colors">Donate</button>
                <a href="https://discord.gg/h52vXUrdp" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-1.5 hover:text-white transition-colors">
                    <span>Discord</span>
                    <i data-lucide="external-link" class="w-3.5 h-3.5 opacity-70"></i>
                </a>
            </nav>

            <!-- Mobile Menu Button -->
            <button onclick="toggleMobileMenu()" class="md:hidden p-2 text-neutral-400 hover:text-white focus:outline-none">
                <i data-lucide="menu" id="menu-icon" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- Mobile Dropdown -->
        <div id="mobile-menu" class="hidden md:hidden bg-[#0a0a0f] border-b border-white/[0.06] px-4 pt-3 pb-5 space-y-3">
            <button onclick="router.navigate('home'); toggleMobileMenu();" class="block w-full text-left text-neutral-300 hover:text-white py-1.5">Home</button>
            <button onclick="router.navigate('games'); toggleMobileMenu();" class="block w-full text-left text-neutral-300 hover:text-white py-1.5">Games</button>
            <button onclick="router.navigate('donate'); toggleMobileMenu();" class="block w-full text-left text-neutral-300 hover:text-white py-1.5">Donate</button>
            <a href="https://discord.gg/h52vXUrdp" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-1.5 text-neutral-300 hover:text-white py-1.5">
                <span>Discord</span>
                <i data-lucide="external-link" class="w-3.5 h-3.5 opacity-70"></i>
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main id="app-container" class="flex-1">
        <!-- Rendered dynamically -->
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-white/[0.06] bg-[#050507] text-neutral-400 py-10 mt-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center space-y-6 md:space-y-0">
            <div class="flex items-center space-x-3">
                <div class="w-7 h-7 rounded-lg bg-white/[0.06] border border-white/10 flex items-center justify-center">
                    <i data-lucide="cpu" class="w-3.5 h-3.5 text-white"></i>
                </div>
                <div>
                    <span class="font-bold text-white text-base tracking-wider">SYMBIOS</span>
                    <p class="text-xs text-neutral-500">Next-Gen Automation Hub</p>
                </div>
            </div>

            <div class="flex space-x-6 text-sm">
                <button onclick="router.navigate('home')" class="hover:text-white transition-colors">Home</button>
                <button onclick="router.navigate('games')" class="hover:text-white transition-colors">Games</button>
                <button onclick="router.navigate('donate')" class="hover:text-white transition-colors">Donate</button>
                <a href="https://discord.gg/h52vXUrdp" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors">Discord</a>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 pt-6 border-t border-white/[0.04] text-xs text-neutral-600 flex flex-col sm:flex-row justify-between items-center space-y-3 sm:space-y-0">
            <p>© <span id="current-year"></span> SYMBIOS. All rights reserved.</p>
            <p class="text-center sm:text-right">SYMBIOS is not affiliated with, endorsed, or sponsored by Roblox Corporation.</p>
        </div>
    </footer>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        const siteConfig = {
            name: "SYMBIOS",
            tagline: "Next-Gen Automation Hub",
            loaderUrl: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/SYMBIOSHUB/SYMBIOS-HUB/refs/heads/main/SYMBIOS.lua"))()',
            discordUrl: "https://discord.gg/h52vXUrdp",
        };

        const rawGamesConfig = [
            { 
                placeId: 106484206883664, 
                name: "Dungeon Lootr [🎉RELEASE]", 
                description: "Full Auto System", 
                thumbnail: "https://tr.rbxcdn.com/180DAY-74e3238344382f02297e172c0366b7a5/768/432/Image/Webp/noFilter", 
                features: ["Auto Parry/Block", "Auto Ability Spammer"] 
            },
            { 
                placeId: 107653945083776, 
                name: "Roll Anime to Fight!", 
                description: "Full Auto System", 
                thumbnail: "https://tr.rbxcdn.com/180DAY-6846bad16c319672d57af6f1a8520871/768/432/Image/Webp/noFilter", 
                features: ["Full Auto"] 
            },
            { 
                placeId: 107778070777162, 
                name: "Steal An Egg", 
                description: "Full Auto System", 
                thumbnail: "https://tr.rbxcdn.com/180DAY-875b2a6dc156ce6dd64eb637e73238ce/768/432/Image/Webp/noFilter", 
                features: ["Full Auto"] 
            },
            { 
                placeId: 102072869879193, 
                name: "Anime Astral Simulator", 
                description: "Full Auto System", 
                thumbnail: "https://tr.rbxcdn.com/180DAY-dfa7f7a3efb732540c051f2b26c5b026/768/432/Image/Webp/noFilter", 
                features: ["Full Auto"] 
            },
            { 
                placeId: 122446657157717, 
                name: "[🔥UPD] Sniper Arena", 
                description: "Full Auto System", 
                thumbnail: "https://tr.rbxcdn.com/180DAY-2c5b249563861c4f436e90c5ac598156/768/432/Image/Webp/noFilter", 
                features: ["Full Auto"] 
            },
            { 
                placeId: 133188236593503, 
                name: "Magic Loot[✨ STAR GAZING EVENT]", 
                description: "Full Auto System", 
                thumbnail: "https://tr.rbxcdn.com/180DAY-26895e2f324fa295e25998de6e97d0d0/768/432/Image/Webp/noFilter", 
                features: ["Full Auto"] 
            }
        ];

        let loadedGames = [];
        let currentRoute = 'home';
        let routeParam = null;

        function slugify(text) {
            return text.toLowerCase().replace(/[^\w ]+/g, "").replace(/ +/g, "-");
        }

        function initGames() {
            loadedGames = rawGamesConfig.map((config) => ({
                placeId: config.placeId,
                slug: slugify(config.name),
                name: config.name,
                description: config.description,
                thumbnail: config.thumbnail,
                features: config.features
            }));
            render();
        }

        const router = {
            navigate: (route, param = null) => {
                currentRoute = route;
                routeParam = param;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                render();
            }
        };

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }

        function copyLoader() {
            navigator.clipboard.writeText(siteConfig.loaderUrl);
            const btn = document.getElementById('copy-btn-text');
            const toast = document.getElementById('toast-notification');
            
            btn.textContent = "Copied";
            toast.classList.remove('hidden');
            
            setTimeout(() => {
                btn.textContent = "Copy Script";
                toast.classList.add('hidden');
            }, 2500);
        }

        // --- VIEWS ---
        function renderHome() {
            return `
                <div class="space-y-16 pb-16">
                    <!-- Hero Section (ดันกล่องก๊อปปี้ขึ้นมา ไม่ให้กลางจอเกินไป) -->
                    <section class="relative pt-12 pb-8 px-4">
                        <div class="max-w-3xl mx-auto space-y-6 text-center">
                            <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full text-xs font-medium bg-white/[0.04] text-neutral-300 border border-white/[0.08]">
                                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                <span>${loadedGames.length}+ Supported Games Active</span>
                            </div>
                            <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white leading-tight">
                                Next-Gen <span class="text-transparent bg-clip-text bg-gradient-to-r from-white via-neutral-300 to-neutral-500">Automation</span> Hub
                            </h1>
                            <p class="text-sm sm:text-base text-neutral-400 max-w-xl mx-auto">
                                Experience high-performance script execution with automatic game detection and seamless integration.
                            </p>

                            <!-- Universal Loader Box (ย้ายขึ้นมาให้เด่น ไม่กลางหน้าจอโล้นๆ) -->
                            <div class="pt-2">
                                <div class="w-full max-w-xl mx-auto rounded-xl bg-[#0c0c10] border border-white/[0.08] overflow-hidden glow-effect text-left">
                                    <div class="flex items-center justify-between px-4 py-2.5 bg-[#121217] border-b border-white/[0.06]">
                                        <div class="flex items-center space-x-2">
                                            <div class="w-2.5 h-2.5 rounded-full bg-neutral-700"></div>
                                            <div class="w-2.5 h-2.5 rounded-full bg-neutral-700"></div>
                                            <div class="w-2.5 h-2.5 rounded-full bg-neutral-700"></div>
                                            <span class="text-xs text-neutral-400 font-mono ml-2">loader.lua</span>
                                        </div>
                                        <div class="relative">
                                            <button onclick="copyLoader()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-md bg-white text-black hover:bg-neutral-200 text-xs font-semibold transition-all">
                                                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                                <span id="copy-btn-text">Copy Script</span>
                                            </button>
                                            <div id="toast-notification" class="hidden absolute right-0 -bottom-10 bg-[#121217] border border-white/10 text-white text-[11px] px-3 py-1 rounded shadow-lg whitespace-nowrap animate-fade-in z-20">
                                                Copied to clipboard!
                                            </div>
                                        </div>
                                    </div>
                                    <div class="p-3.5 font-mono text-xs sm:text-sm text-neutral-300 overflow-x-auto bg-[#08080a]">
                                        <code>${siteConfig.loaderUrl}</code>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Supported Games Preview -->
                    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between items-end mb-6">
                            <div>
                                <h2 class="text-xl sm:text-2xl font-bold text-white">Supported Games</h2>
                                <p class="text-xs sm:text-sm text-neutral-400 mt-0.5">Explore top experiences compatible with SYMBIOS.</p>
                            </div>
                            <button onclick="router.navigate('games')" class="hidden sm:flex items-center space-x-1 text-xs sm:text-sm font-medium text-neutral-300 hover:text-white transition-colors">
                                <span>View All</span>
                                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                            ${loadedGames.slice(0, 6).map(game => renderGameCard(game)).join('')}
                        </div>

                        <div class="mt-6 text-center sm:hidden">
                            <button onclick="router.navigate('games')" class="inline-flex items-center space-x-1 text-sm font-medium text-white underline">
                                <span>View All Games</span>
                                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </section>
                </div>
            `;
        }

        function renderGames() {
            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8 animate-fade-in">
                    <div class="text-center space-y-2">
                        <h1 class="text-3xl font-extrabold text-white">Supported Games</h1>
                        <p class="text-sm text-neutral-400">Explore every Roblox experience currently supported by SYMBIOS.</p>
                    </div>

                    <div class="space-y-6">
                        <div class="relative max-w-md mx-auto">
                            <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-neutral-500"></i>
                            <input 
                                type="text" 
                                oninput="filterGames(this.value)" 
                                placeholder="Search games..." 
                                class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-[#0c0c10] border border-white/[0.08] text-sm text-white placeholder-neutral-500 focus:outline-none focus:border-white/30 transition-colors"
                            />
                        </div>

                        <div id="games-grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                            ${loadedGames.map(game => renderGameCard(game)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGameDetail(slug) {
            const game = loadedGames.find(g => g.slug === slug);
            if (!game) return renderGames();

            return `
                <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-6 animate-fade-in">
                    <button onclick="router.navigate('games')" class="inline-flex items-center space-x-2 text-xs font-medium text-neutral-400 hover:text-white transition-colors">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        <span>Back to Games</span>
                    </button>

                    <div class="rounded-xl bg-[#0c0c10] border border-white/[0.08] overflow-hidden p-6 sm:p-8 space-y-6">
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
                            <div class="flex items-center space-x-4">
                                <div class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-lg overflow-hidden bg-neutral-900 border border-white/[0.08] flex-shrink-0">
                                    <img src="${game.thumbnail}" alt="${game.name}" class="w-full h-full object-cover" />
                                </div>
                                <div class="space-y-2">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
                                        Supported
                                    </span>
                                    <h1 class="text-2xl sm:text-3xl font-bold text-white">${game.name}</h1>
                                </div>
                            </div>

                            <a href="https://www.roblox.com/games/${game.placeId}" target="_blank" rel="noopener noreferrer" class="w-full sm:w-auto inline-flex items-center justify-center space-x-2 px-5 py-2.5 rounded-lg bg-white text-black font-semibold text-sm hover:bg-neutral-200 transition-colors">
                                <span>Play Game</span>
                                <i data-lucide="external-link" class="w-4 h-4"></i>
                            </a>
                        </div>

                        <div class="pt-4 border-t border-white/[0.06]">
                            <h3 class="text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-2">Description</h3>
                            <p class="text-sm text-neutral-300 leading-relaxed">${game.description}</p>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-base font-semibold text-white">Supported Features</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${game.features.map(feat => `
                                <div class="flex items-center space-x-3 p-3 rounded-lg bg-[#0c0c10] border border-white/[0.06]">
                                    <div class="p-1 rounded bg-emerald-500/10 text-emerald-400">
                                        <i data-lucide="check" class="w-4 h-4"></i>
                                    </div>
                                    <span class="text-sm font-medium text-neutral-200">${feat}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDonate() {
            return `
                <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16 space-y-8 animate-fade-in">
                    <div class="text-center space-y-2">
                        <h1 class="text-3xl font-extrabold text-white">Support SYMBIOS</h1>
                        <p class="text-sm text-neutral-400 max-w-md mx-auto">
                            Help support the continuous development and updates of SYMBIOS.
                        </p>
                    </div>

                    <div class="max-w-md mx-auto text-center py-12 px-6 rounded-xl bg-[#0c0c10] border border-white/[0.08] relative overflow-hidden">
                        <div class="w-32 h-32 mx-auto mb-6 rounded-xl border-2 border-dashed border-white/10 flex items-center justify-center bg-neutral-900/50">
                            <span class="text-xs font-mono text-neutral-500 tracking-wider">[ QR CODE ]</span>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-1">Coming Soon</h3>
                        <p class="text-xs text-neutral-400">Donation gateway is currently under configuration.</p>
                    </div>
                </div>
            `;
        }

        function renderGameCard(game) {
            return `
                <div onclick="router.navigate('detail', '${game.slug}')" class="group flex flex-col rounded-xl bg-[#0c0c10] border border-white/[0.08] hover:border-white/[0.2] transition-all duration-300 overflow-hidden hover:-translate-y-1 cursor-pointer">
                    <div class="relative aspect-video w-full overflow-hidden bg-neutral-900">
                        <img src="${game.thumbnail}" alt="${game.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                        <div class="absolute top-3 right-3">
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
                                Supported
                            </span>
                        </div>
                    </div>
                    <div class="p-4 flex flex-col flex-1 justify-between">
                        <div>
                            <h3 class="font-semibold text-white text-sm group-hover:text-neutral-200 transition-colors line-clamp-1">${game.name}</h3>
                            <p class="text-xs text-neutral-400 mt-1 line-clamp-2">${game.description}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-white/[0.06] flex items-center justify-between text-xs text-neutral-400">
                            <span class="text-neutral-400">${game.features.length} Features</span>
                            <span class="flex items-center space-x-1 text-white group-hover:underline">
                                <span>Details</span>
                                <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }

        function filterGames(query) {
            const filtered = loadedGames.filter(g => g.name.toLowerCase().includes(query.toLowerCase()));
            const container = document.getElementById('games-grid-container');
            if (filtered.length > 0) {
                container.innerHTML = filtered.map(game => renderGameCard(game)).join('');
            } else {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-[#0c0c10] rounded-xl border border-white/[0.08]">
                        <p class="text-neutral-400 text-sm">No games found.</p>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function render() {
            const container = document.getElementById('app-container');
            if (currentRoute === 'home') {
                container.innerHTML = renderHome();
            } else if (currentRoute === 'games') {
                container.innerHTML = renderGames();
            } else if (currentRoute === 'detail') {
                container.innerHTML = renderGameDetail(routeParam);
            } else if (currentRoute === 'donate') {
                container.innerHTML = renderDonate();
            }
            lucide.createIcons();
        }

        document.getElementById('current-year').textContent = new Date().getFullYear();
        initGames();
    </script>
</body>
</html>
